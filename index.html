
<!doctype html><html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FF8FB8">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>Narada Study V5.1</title></head>
<body>
<header><h1>🎀 Narada Study</h1><div id="todayLabel"></div></header>
<main>
<section id="todayPage" class="page"></section>
<section id="schedulePage" class="page hidden"></section>
<section id="homeworkPage" class="page hidden"></section>
<section id="settingsPage" class="page hidden"></section>
</main>
<nav>
<button data-tab="today">วันนี้</button>
<button data-tab="schedule">ตาราง</button>
<button data-tab="homework">การบ้าน</button>
<button data-tab="settings">ตั้งค่า</button>
</nav>

<div id="editModal" class="modal hidden">
 <div class="box">
  <h2>แก้ไขคาบเรียน</h2>
  <label>วัน</label>
  <select id="editDay">
   <option>จันทร์</option><option>อังคาร</option><option>พุธ</option>
   <option>พฤหัส</option><option>ศุกร์</option><option>เสาร์</option><option>อาทิตย์</option>
  </select>
  <label>เวลา</label><input id="editTime" type="time">
  <label>ครู/วิชา</label><input id="editTeacher" type="text">
  <div class="row">
   <button id="cancelEdit" class="secondary">ยกเลิก</button>
   <button id="saveEdit" class="primary">บันทึก</button>
  </div>
 </div>
</div>
<script src="app.js"></script>
</body></html>
