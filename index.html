
<!doctype html><html lang='th'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Narada V7.2.2 Ultimate</title><link rel='manifest' href='manifest.json'><link rel='stylesheet' href='style.css'></head>
<body><header class='hero'><div><div class='logo'>🎀</div><h1>Narada</h1><small>V7.2.2 Ultimate</small></div>
<div class='actions'><button id='settingsBtn'>⚙️</button><button id='refreshBtn'>↻</button></div></header>
<main><section class='glass'><div class='month'>September 2026</div><div id='cal' class='cal'></div></section>
<section class='glass'><h3>📚 คาบเรียนถัดไป</h3><div id='next'>ครูปาล์ม • 18:30</div></section></main>
<div id='settings' class='sheet'><div class='panel'><h3>ตั้งค่า</h3>
<label><input id='notifyToggle' type='checkbox'> เปิดการแจ้งเตือน</label>
<label>เตือนล่วงหน้า <select id='lead'><option>5</option><option selected>10</option><option>15</option></select> นาที</label>
<label><input id='vibrate' type='checkbox' checked> เปิดการสั่น</label>
<button id='test'>🔔 ทดสอบเสียง</button><button id='close'>ปิด</button></div></div>
<script src='app.js'></script></body></html>
