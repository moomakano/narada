<!doctype html><html lang='th'><head>
<meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Narada V5.1 Hotfix</title><link rel='stylesheet' href='style.css'></head><body>
<header><h1>🎀 Narada Study</h1></header>
<main id="schedulePage"></main>

<div id="editModal" class="modal hidden">
  <div class="box">
    <h2>แก้ไขคาบเรียน</h2>
    <label>วัน</label>
    <select id="editDay"><option>จันทร์</option><option>อังคาร</option><option>พุธ</option><option>พฤหัส</option><option>ศุกร์</option><option>เสาร์</option><option>อาทิตย์</option></select>
    <label>เวลา</label><input id="editTime" type="time">
    <label>ครู/วิชา</label><input id="editTeacher" type="text">
    <div class="row">
      <button type="button" id="cancelEdit" class="secondary">ยกเลิก</button>
      <button type="button" id="saveEdit" class="primary">บันทึก</button>
    </div>
  </div>
</div>
<script src="app.js"></script></body></html>
