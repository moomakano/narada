
<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Narada V7.2</title>
<link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head>
<body>
<header class="hero"><div><div class="logo">🎀</div><h1>Narada V7.2</h1><p>Apple Calendar Edition</p></div>
<div class="actions"><button id="themeBtn">🎨</button><button id="setBtn">⚙️</button><button id="refreshBtn">↻</button></div></header>
<main>
<div class="glass"><div class="month">September 2026</div><div id="calendar" class="calendar"></div></div>
<div class="glass next"><h3>📚 คาบเรียนถัดไป</h3><div id="nextClass">ไม่มีคาบเรียนวันนี้</div></div>
</main>
<button class="fab">＋</button>
<div id="sheet" class="sheet"><div class="panel"><h3>ตั้งค่า</h3>
<button id="soundBtn">🔔 ทดสอบเสียง</button><button id="vibrateBtn">📳 ทดสอบการสั่น</button><button id="closeBtn">ปิด</button></div></div>
<script src="app.js"></script></body></html>
