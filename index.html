<!doctype html><html lang='th'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='theme-color' content='#FF8FB8'><link rel='manifest' href='manifest.json'><link rel='apple-touch-icon' href='assets/icons/icon-192.png'><title>Narada Study V5</title><style>body{margin:0;font-family:-apple-system;background:#FFF7FB}header{background:#FF8FB8;color:#fff;padding:20px}main{padding:16px 16px 90px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 4px 12px #0002}nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;padding:8px;box-shadow:0 -3px 10px #0002}button{border:0;border-radius:12px;padding:12px;background:#FFE3EF;color:#C2185B;font-weight:700}</style></head><body><header><h1>🎀 Narada Study</h1><div id=d></div></header><main id=app></main><nav><button onclick='show(0)'>วันนี้</button><button onclick='show(1)'>ตาราง</button><button onclick='show(2)'>การบ้าน</button><button onclick='show(3)'>ตั้งค่า</button></nav><script>const S='nv5';let s=JSON.parse(localStorage.getItem(S)||'{"h":[],"t":[["จันทร์","18:30","ครูปาล์ม"],["อังคาร","17:00","ครูใบตอง"]]}');document.getElementById('d').textContent=new Date().toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long'});function save(){localStorage.setItem(S,JSON.stringify(s))}function show(i){let a=document.getElementById('app');if(i==0)a.innerHTML='<div class=card><h2>วันนี้</h2><p>ยินดีต้อนรับ 👧</p></div>';if(i==1)a.innerHTML='<button onclick=addT()>➕เพิ่ม</button>'+s.t.map((x,n)=>`<div class=card><b>${x[0]}</b><br>${x[1]} ${x[2]} <button onclick="delT(${n})">ลบ</button></div>`).join('');if(i==2)a.innerHTML='<button onclick=addH()>➕เพิ่มการบ้าน</button>'+s.h.map((x,n)=>`<div class=card><input type=checkbox ${x[2]?"checked":""} onchange="s.h[${n}][2]=!s.h[${n}][2];save();show(2)"> <b>${x[0]}</b><br>${x[1]} <button onclick="s.h.splice(${n},1);save();show(2)">ลบ</button></div>`).join('');if(i==3)a.innerHTML='<div class=card><button onclick=exp()>สำรองข้อมูล</button></div>'}function addT(){let d=prompt("วัน");if(!d)return;s.t.push([d,prompt("เวลา")||"",prompt("ครู")||""]);save();show(1)}function delT(i){s.t.splice(i,1);save();show(1)}function addH(){let t=prompt("การบ้าน");if(!t)return;s.h.push([t,prompt("วิชา")||"",false]);save();show(2)}function exp(){let b=new Blob([JSON.stringify(s,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='narada-backup.json';a.click()}if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js');show(0);</script></body></html>
